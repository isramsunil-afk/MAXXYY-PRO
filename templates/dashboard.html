<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAXXYY PRO</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00ff00">
<style>body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}h1{color:#0f0;font-size:30px}.box{border:2px solid #0f0;border-radius:12px;padding:20px;margin:20px auto;max-width:400px}#install{padding:15px 25px;background:#0f0;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin-top:10px}</style>
</head><body>
<h1>MAXXYY PRO LIVE 🔥</h1>
<p>Final Dashboard Working!</p>
<div class="box">
<h2>Welcome Nanna!</h2>
<p id="msg">Checking PWA...</p>
<button id="install">📲 INSTALL APP</button>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').then(()=>{document.getElementById('msg').innerHTML='✅ PWA Ready! Install Chey!'})}
let p;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e;});
document.getElementById('install').onclick=()=>{if(p){p.prompt();p.userChoice.then(r=>{if(r.outcome==='accepted')alert('GETHU NANNA! Installed! 🔥')})}else{alert('Chrome 3 dots -> Add to Home Screen nokku nanna!')}}
</script></body></html>
